[package]
name = "safeagent"
version = "0.2.0"
edition = "2021"
publish = false

[workspace]

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sysinfo = { version = "0.33", default-features = false, features = ["system"] }
uuid = "1"
ed25519-dalek = "2"
rand = "0.8"
base64 = { version = "0.22", features = ["std"] }

[profile.release]
lto = true
codegen-units = 1
strip = true
